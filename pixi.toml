[workspace]
name = "line-dog-pet"
version = "0.1.0"
description = "Windows desktop pet built with Python 3.11 and PySide6"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.11.*"

[pypi-dependencies]
pyside6 = ">=6.7,<7"
pyinstaller = ">=6,<7"
pillow = ">=11,<13"

[tasks]
start = "python main.py"
check = "python -m compileall -q main.py src tools tests"
smoke = "python tests/smoke_test.py"
normalize-assets = "python tools/normalize_assets.py"
build = "python tools/build_exe.py"
build-debug = 'pyinstaller --noconfirm --clean --onefile --paths "src" --name LineDogPet-debug --add-data "assets;assets" main.py'
